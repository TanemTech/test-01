name: Publish TANEM site (manual request)

# Code changes are drafts; no validation/deployment is launched by a push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanem-test-01-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package static site without publisher scripts or GitHub settings
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          mkdir -p "$RUNNER_TEMP/tanem-site"
          rsync -r \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/deploy/' \
            --exclude='/ops/' \
            --exclude='.*' \
            ./ "$RUNNER_TEMP/tanem-site/"
      - name: Upload site files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tanem-site
          path: ${{ runner.temp }}/tanem-site/
          if-no-files-found: error
          retention-days: 7
