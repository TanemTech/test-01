name: Validate TANEM test site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanem-test-01-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f assets/test-mark.svg
          grep -Fq '<!doctype html>' index.html
          grep -Fq 'Тестовая публикация № 01' index.html
          grep -Fq 'Проверка № 05:' index.html
          grep -Fq '<meta name="robots" content="noindex, nofollow">' index.html
          grep -Fq 'href="style.css"' index.html
          grep -Fq 'src="assets/test-mark.svg"' index.html
          test "$(wc -c < index.html)" -le 100000
          test "$(wc -c < style.css)" -le 100000
          test "$(wc -c < assets/test-mark.svg)" -le 100000
      - name: Publish checked HTML, CSS and image as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tanem-site
          path: |
            index.html
            style.css
            assets/test-mark.svg
          if-no-files-found: error
          retention-days: 7
