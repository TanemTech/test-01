name: Publish tested site to Selectel

on:
  workflow_run:
    workflows: ['Validate TANEM test site']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: selectel-site
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TANEM_SITE_SSH: ${{ secrets.TANEM_SITE_SSH }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check connection
        id: connected
        run: |
          if [ -n "$TANEM_SITE_SSH" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'NOT CONNECTED: run Connect sites to Selectel after one-time setup.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.connected.outputs.ready == 'true'
        with:
          repository: TanemTech/test-01
          # Pin publisher implementation to a tested revision, not current site code.
          ref: ea12967170ec8c02a3f4312cd12b843ed7876245
          path: publisher
          persist-credentials: false
      - name: Publish approved artifact and check external HTTP
        if: steps.connected.outputs.ready == 'true'
        run: >-
          python3 publisher/deploy/client.py publish --repo "$SOURCE_REPO" --run-id "$SOURCE_RUN"
          --workflow validate.yml --artifact tanem-site
