name: Check existing Selectel connection

on:
  push:
    branches: [main]
    paths: ['deploy/audit.py', '.github/workflows/publisher-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check existing connection without changing or publishing anything
        env:
          TANEM_SERVER: ${{ secrets.TANEM_SERVER }}
          GH_TOKEN: ${{ secrets.TANEM_GITHUB_TOKEN }}
        run: python3 deploy/audit.py
